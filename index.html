<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Динамическое добавление элементов</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Демонстрация динамического добавления элементов</h1>

        <div class="controls">
            <button id="addElementBtn">Добавить элемент</button>
            <button id="colorElementBtn">Окрасить элементы</button>
            <button id="clearBtn">Очистить</button>
        </div>

        <div id="elementsContainer" class="elements-container">
            <!-- Здесь будут добавляться новые элементы -->
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
