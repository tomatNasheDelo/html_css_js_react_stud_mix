<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <title>Псевдоклассы</title>
</head>

<body>
    <h2>:hover на кнопке</h2>
    <a href="#" class="buttonN">Наведи на меня курсор</a>

    <h2>:first-child и :last-child</h2>
    <ul>
        <li>Первый пункт</li>
        <li>Второй пункт</li>
        <li>Третий пункт</li>
        <li>Четвёртый пункт</li>
    </ul>

    <h2>:nth-child(even) в таблице </h2>
    <table>
        <tr>
            <td>Строка 1</td>
            <td>Строка 1 справа </td>
            <td>Строка 1 правее права</td>
        </tr>
        <tr>
            <td>Строка 2</td>
        </tr>
        <tr>
            <td>Строка 3</td>
        </tr>
        <tr>
            <td>Строка 4</td>
        </tr>
    </table>

    <h2>:focus в поле ввода</h2>
    <input type="text" placeholder="Кликни сюда">
</body>

</html>
