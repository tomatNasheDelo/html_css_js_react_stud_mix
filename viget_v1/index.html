<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Демо чат-виджета</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Моя страница</h1>
    <p>Здесь содержимое сайта.</p>

    <!-- Кнопка открытия чата -->
    <button id="chat-toggle" aria-label="Открыть чат">💬</button>

    <!-- Окно чата -->
    <div id="chat-window" class="hidden">
        <div class="chat-header">
            <span>Чат с оператором</span>
            <button id="chat-close" aria-label="Закрыть">×</button>
        </div>

        <div id="chat-messages"></div>

        <form id="chat-form" autocomplete="off">
            <input id="chat-input" type="text" placeholder="Введите сообщение..." maxlength="1000">
            <button type="submit">Отправить</button>
        </form>
    </div>

    <script src="widget.js"></script>
</body>

</html>
